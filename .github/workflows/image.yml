name: Publish images

on:
    workflow_run:
        workflows: [CI]
        types: [completed]

permissions:
    contents: read

jobs:
    publish:
        if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            packages: write
        strategy:
            matrix:
                include:
                    - app: api
                      dockerfile: Dockerfile
                      image-suffix: "-api"
                    - app: web
                      dockerfile: Dockerfile.web
                      image-suffix: "-web"
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
            - name: Configure frontend build
              if: matrix.app == 'web'
              run: cp docs/frontend.example.toml apps/web/config.toml
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Set image name
              id: image
              env:
                  REPOSITORY: ${{ github.repository }}
                  IMAGE_SUFFIX: ${{ matrix.image-suffix }}
              run: echo "name=ghcr.io/${REPOSITORY,,}${IMAGE_SUFFIX}" >> "$GITHUB_OUTPUT"
            - uses: docker/metadata-action@v5
              id: metadata
              with:
                  images: ${{ steps.image.outputs.name }}
                  tags: type=raw,value=${{ github.event.workflow_run.head_branch }}
                  flavor: latest=false
            - uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  push: true
                  tags: ${{ steps.metadata.outputs.tags }}
                  labels: ${{ steps.metadata.outputs.labels }}
                  cache-from: type=gha,scope=${{ matrix.app }}
                  cache-to: type=gha,scope=${{ matrix.app }},mode=max
