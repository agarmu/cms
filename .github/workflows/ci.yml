name: CI

on:
    push:
        branches: [main]
        tags: ["*"]
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2
            - run: bun install --frozen-lockfile
            - name: Configure frontend build
              run: cp docs/frontend.example.toml apps/web/config.toml
            - run: bun run check
            - run: bun run format:check
            - run: bun run test
            - run: bun run build:web
