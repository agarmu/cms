# Example config file
# All durations are in milliseconds.
[serve]
baseUrl = "https://photos.example.com"
port = 3000
bindLocal = false
# unix = "./data/cms.sock"

[mcp]
enabled = false

# For local tests, replace this section with:
# [auth]
# kind = "no-auth"
[auth]
kind = "rfc-9068"
algorithm = "ES256"
issuer = "https://auth.example.com/"
jwksUrl = "https://auth.example.com/.well-known/jwks.json"
allowedSubjects = ["replace-with-your-user-id"]

[database]
# Public connection details
# keep the password in secrets.toml.
url = "postgres://example-user@localhost:5432/photos_cms"
connectTimeout = 10_000

[database.pool]
maxConnections = 10
idleTimeout = 30_000

[database.tls]
mode = "disable"

[storage]
backend = "s3"
# virtualHostedStyle endpoint (required for s3)
endpoint = "https://example-photo-bucket.s3.us-east-1.amazonaws.com"
# set region explicitly for providers that require a different signing region.
# region = "auto"
# For local storage, replace the settings above with:
# backend = "local"
# directory = "./data/blobs"

[images]
maxBytes = 26_214_400
maxPixels = 60_000_000
quality = 82 # webp quality

# variants are generated only when the original's shorter side is large enough.
[[images.variants]]
name = "large"
minSide = 1920

[[images.variants]]
name = "medium"
minSide = 960

[[images.variants]]
name = "thumbnail"
minSide = 320

[workers]
interval = 5_000
batchSize = 10

[workers.backoff]
# Exponential backoff after failed attempts.
maxRetries = 5 # Retries after the initial attempt.
multiplier = 2 # Retry-delay multiplier.

[workers.upload]
waitTime = 3_600_000
retryTime = 10_000 # Initial delay for both workers; exponential backoff starts here.

[http]
maxBodyBytes = 65_536

[telemetry]
enabled = true
serviceName = "photos-cms"

[telemetry.traces]
enabled = true
endpoint = "https://collector.example.com/v1/traces"

[telemetry.metrics]
enabled = true
endpoint = "https://collector.example.com/v1/metrics"

[telemetry.logs]
enabled = true
endpoint = "https://collector.example.com/v1/logs"
