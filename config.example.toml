# Example config file
# All times in ms
[serve]
baseUrl = "https://photos.example.com"
port = 3000
bindLocal = false
# unix = "./data/cms.sock"

[mcp]
enabled = false

# For local tests, replace this section with:
# [auth]
# kind = "no-auth"
[auth]
kind = "rfc-9068"
issuer = "https://your-tenant.us.auth0.com/"
audience = "https://photos.example.com/"
jwksUrl = "https://your-tenant.us.auth0.com/.well-known/jwks.json"
allowedSubjects = ["auth0|replace-with-your-user-id"]

[database]
# Public connection details
# keep the password in secrets.toml.
url = "postgres://example-user@localhost:5432/photos_cms"
# all times in ms
connectTimeout = 10_000

[database.pool]
maxConnections = 10
idleTimeout = 30_000 # Milliseconds.

[database.tls]
mode = "disable"

[storage]
backend = "s3"
# virtualHostedStyle endpoint (required for s3)
endpoint = "https://example-photo-bucket.s3.us-east-1.amazonaws.com"
# set region explicitly for providers that require a different signing region.
# region = "auto"
# For local storage, replace the settings above with:
# backend = "local"
# directory = "./data/blobs"
# Local storage supports reads and writes, but does not issue direct-upload URLs.

[images]
maxBytes = 26_214_400
maxPixels = 60_000_000
quality = 82 # webp quality

# variants are generated only when the original's shorter side is large enough.
[[images.variants]]
name = "large"
minSide = 1920

[[images.variants]]
name = "medium"
minSide = 960

[[images.variants]]
name = "thumbnail"
minSide = 320

[workers]
interval = 5_000
batchSize = 10

[workers.backoff]
# exp backoff in case of errors
maxRetries = 5 # how long to keep going
multiplier = 2 # factor to multiply delay by (after each failure)

[workers.upload]
waitTime = 3_600_000
retryTime = 10_000 # Initial delay for both workers; exponential backoff starts here.

[http]
maxBodyBytes = 65_536

[telemetry]
enabled = true
serviceName = "photos-cms"

[telemetry.traces]
enabled = true
endpoint = "https://collector.example.com/v1/traces"

[telemetry.metrics]
enabled = true
endpoint = "https://collector.example.com/v1/metrics"

[telemetry.logs]
enabled = true
endpoint = "https://collector.example.com/v1/logs"
