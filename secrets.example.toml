# Copy to secrets.toml for private settings; secrets.toml is ignored by Git.

[database]
# Password for database.url in config.toml.
password = "replace-me"

[storage]
# AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
accessKeyId = "replace-me"
secretAccessKey = "replace-me"
# sessionToken = "replace-me" # AWS_SESSION_TOKEN, for temporary credentials.

# Equivalent to headers supplied through OTEL_EXPORTER_OTLP_TRACES_HEADERS.
[telemetry.traces.headers]
Authorization = "Bearer replace-me"

# Equivalent to headers supplied through OTEL_EXPORTER_OTLP_METRICS_HEADERS.
[telemetry.metrics.headers]
Authorization = "Bearer replace-me"

# Equivalent to headers supplied through OTEL_EXPORTER_OTLP_LOGS_HEADERS.
[telemetry.logs.headers]
Authorization = "Bearer replace-me"
