# Copy to config.toml. Durations are in milliseconds.
[serve]
baseUrl = "https://photos.example.com"
port = 3000
bindLocal = false
# unix = "./data/cms.sock"

[mcp]
enabled = false

[auth]
kind = "rfc-9068"
algorithm = "ES384"
issuer = "https://auth.example.com/"
jwksUrl = "https://auth.example.com/.well-known/jwks.json"
# audience = "https://photos.example.com/"
# allowedSubjects = ["replace-with-your-user-id"]

[database]
# Password goes in secrets.toml.
url = "postgres://example-user@localhost:5432/photos_cms"
connectTimeout = 10_000

[database.pool]
maxConnections = 10
idleTimeout = 30_000

[database.tls]
mode = "disable"

[storage]
backend = "s3"
# Use the bucket's hostname, without a path.
endpoint = "https://example-photo-bucket.s3.us-east-1.amazonaws.com"
# region = "auto"

[images]
maxBytes = 26_214_400
maxPixels = 60_000_000
quality = 82

# minSide is the shorter side in pixels.
[[images.variants]]
name = "large"
minSide = 1920

[[images.variants]]
name = "medium"
minSide = 960

[[images.variants]]
name = "thumbnail"
minSide = 320

[workers]
interval = 5_000
batchSize = 10

[workers.backoff]
maxRetries = 5
multiplier = 2

[workers.upload]
waitTime = 3_600_000
retryTime = 10_000

[http]
maxBodyBytes = 65_536
allowedOrigins = ["http://localhost:4321"]

[telemetry]
enabled = true
serviceName = "photos-cms"

[telemetry.traces]
enabled = true
endpoint = "https://collector.example.com/v1/traces"

[telemetry.metrics]
enabled = true
endpoint = "https://collector.example.com/v1/metrics"

[telemetry.logs]
enabled = true
endpoint = "https://collector.example.com/v1/logs"

# Demo data is public; use a separate database and image store.
# [demo.database]
# url = "postgres://demo-user@localhost:5432/photos_cms_demo"
# [demo.storage]
# backend = "local"
